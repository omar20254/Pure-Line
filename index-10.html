  <style>
  :root{
    --forest:#223420;
    --forest-2:#33482e;
    --forest-3:#41573c;
    --gold:#CE9A3A;
    --gold-dark:#A97B24;
    --rust:#B8562D;
    --rust-soft:#F3E2D6;
    --cream:#FAF6EC;
    --surface:#FFFFFF;
    --ink:#23271F;
    --ink-soft:#6B7062;
    --line:#E4DCC8;
    --success:#4C7A3D;
    --success-soft:#E4EEDF;
    --danger:#B03A2E;
    --danger-soft:#F6E1DE;
    --radius:14px;
    --shadow:0 2px 10px rgba(34,52,32,.06), 0 1px 2px rgba(34,52,32,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:#fff;}
  button, input, select{font-family:'Tajawal',sans-serif;}
  a{color:inherit;}

  /* ---------- feather signature icon ---------- */
  .feather-icon{display:inline-block; vertical-align:middle;}

  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(1200px 600px at 15% 10%, rgba(206,154,58,.14), transparent 60%),
      radial-gradient(1000px 600px at 90% 90%, rgba(184,86,45,.10), transparent 55%),
      linear-gradient(160deg, var(--forest) 0%, #1a2818 100%);
    padding:24px;
  }
  .login-card{
    background:var(--surface);
    border-radius:20px;
    width:100%;
    max-width:400px;
    padding:40px 34px 34px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .login-card::before{
    content:"";
    position:absolute; top:0; right:0; left:0; height:6px;
    background:linear-gradient(90deg, var(--gold), var(--rust), var(--forest-3));
  }
  .login-logo{
    width:84px; height:84px; border-radius:50%;
    margin:6px auto 14px; object-fit:cover;
    border:3px solid var(--gold);
    background:var(--cream);
  }
  .login-logo.fallback{
    display:flex; align-items:center; justify-content:center;
    color:var(--forest);
  }
  .login-title{font-size:22px; font-weight:800; color:var(--forest); margin:2px 0 2px;}
  .login-sub{font-size:13px; color:var(--ink-soft); margin-bottom:26px;}
  .field{text-align:right; margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:500;}
  .field input{
    width:100%; padding:12px 14px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--cream);
    font-size:15px; color:var(--ink); transition:.15s;
  }
  .field input:focus{outline:none; border-color:var(--gold); background:#fff; box-shadow:0 0 0 3px rgba(206,154,58,.18);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:10px; cursor:pointer;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:14.5px;
    padding:12px 20px; transition:.15s; white-space:nowrap;
  }
  .btn-primary{background:var(--forest); color:#fff; width:100%; margin-top:6px;}
  .btn-primary:hover{background:var(--forest-2);}
  .btn-gold{background:var(--gold); color:#2a1f06;}
  .btn-gold:hover{background:var(--gold-dark); color:#fff;}
  .btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
  .btn-outline:hover{border-color:var(--forest); background:var(--cream);}
  .btn-danger-outline{background:transparent; border:1.5px solid var(--danger); color:var(--danger);}
  .btn-danger-outline:hover{background:var(--danger-soft);}
  .btn-sm{padding:7px 12px; font-size:13px; border-radius:8px;}
  .login-error{
    background:var(--danger-soft); color:var(--danger); border-radius:8px;
    padding:9px 12px; font-size:13px; margin-bottom:12px; display:none; font-weight:600;
  }
  .login-hint{margin-top:18px; font-size:11.5px; color:var(--ink-soft); opacity:.75;}

  /* ---------- APP SHELL ---------- */
  #app{display:none; min-height:100vh;}
  .shell{display:flex; min-height:100vh;}

  .sidebar{
    width:248px; flex-shrink:0;
    background:linear-gradient(190deg, var(--forest) 0%, #1c2c1a 100%);
    color:#f4efe1;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding:22px 18px 16px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .sidebar-brand img, .sidebar-brand .fallback{
    width:40px; height:40px; border-radius:50%; object-fit:cover;
    border:2px solid var(--gold); flex-shrink:0;
    background:rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
  }
  .sidebar-brand-text{line-height:1.25;}
  .sidebar-brand-text b{display:block; font-size:14.5px; font-weight:800; color:#fff;}
  .sidebar-brand-text span{font-size:11px; color:var(--gold); font-weight:500;}

  .nav{flex:1; padding:14px 10px; overflow-y:auto;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:11px 13px; border-radius:10px; margin-bottom:3px;
    font-size:14px; font-weight:500; color:#dcdccb;
    cursor:pointer; transition:.15s; border:none; background:none; width:100%; text-align:right;
  }
  .nav-item svg{flex-shrink:0; opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:var(--gold); color:#2a1f06; font-weight:700;}
  .nav-item.active svg{opacity:1;}
  .nav-section-label{font-size:10.5px; color:rgba(244,239,225,.4); font-weight:700; letter-spacing:.5px; padding:14px 13px 6px;}

  .sidebar-footer{padding:14px 14px 18px; border-top:1px solid rgba(255,255,255,.08);}
  .sidebar-footer .btn{width:100%;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:16px 26px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{font-size:19px; font-weight:800; color:var(--forest); margin:0;}
  .topbar .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-weight:500;}
  .today-pill{
    background:var(--cream); border:1px solid var(--line); border-radius:999px;
    padding:7px 15px; font-size:12.5px; font-weight:600; color:var(--forest-2);
  }

  .content{padding:24px 26px 60px; flex:1;}

  /* ---------- shared components ---------- */
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
  .menu-toggle{display:none;}
  .sidebar-backdrop{display:none;}
  @media (max-width:680px){
    .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
    .sidebar{position:fixed; z-index:60; top:0; right:0; left:auto; height:100vh; transform:translateX(100%); transition:.2s;}
    .sidebar.open{transform:translateX(0);}
    .content{padding:16px;}
    .menu-toggle{
      display:inline-flex; align-items:center; justify-content:center;
      width:38px; height:38px; border-radius:9px; border:1.5px solid var(--line);
      background:var(--surface); cursor:pointer; flex-shrink:0; margin-left:10px;
    }
    .sidebar-backdrop{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55;
    }
    .sidebar-backdrop.open{display:block;}
  }

  .stat-card{
    background:var(--surface); border-radius:var(--radius); padding:18px 20px;
    box-shadow:var(--shadow); border:1px solid var(--line); position:relative; overflow:hidden;
  }
  .stat-card .icon-wrap{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
  }
  .stat-card .label{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
  .stat-card .value{font-size:24px; font-weight:800; color:var(--forest);}
  .stat-card .value.warn{color:var(--rust);}
  .stat-card .delta{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

  .panel{
    background:var(--surface); border-radius:var(--radius); border:1px solid var(--line);
    box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;
  }
  .panel-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .panel-head h3{font-size:15.5px; font-weight:800; color:var(--forest); margin:0; display:flex; align-items:center; gap:8px;}
  .panel-head p{font-size:12px; color:var(--ink-soft); margin:2px 0 0;}
  .panel-body{padding:18px 20px;}

  form.inline-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; align-items:end;}
  .f{display:flex; flex-direction:column; gap:5px;}
  .f label{font-size:12px; color:var(--ink-soft); font-weight:600;}
  .f input, .f select{
    padding:9.5px 11px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--cream); font-size:13.5px; color:var(--ink);
  }
  .f input:focus, .f select:focus{outline:none; border-color:var(--gold); background:#fff;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:right; padding:10px 12px; background:var(--cream); color:var(--forest-2);
    font-weight:700; font-size:12.5px; border-bottom:2px solid var(--line);
  }
  tbody td{padding:10px 12px; border-bottom:1px solid var(--line); color:var(--ink);}
  tbody tr:hover{background:rgba(206,154,58,.06);}
  tbody tr:last-child td{border-bottom:none;}
  .empty-row td{text-align:center; color:var(--ink-soft); padding:22px; font-size:13px;}
  .table-wrap{overflow-x:auto;}

  .tag{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
  .tag-ok{background:var(--success-soft); color:var(--success);}
  .tag-warn{background:var(--rust-soft); color:var(--rust);}
  .tag-danger{background:var(--danger-soft); color:var(--danger);}
  .tag-neutral{background:var(--cream); color:var(--ink-soft); border:1px solid var(--line);}

  .del-btn{
    background:none; border:none; cursor:pointer; color:var(--danger); opacity:.65;
    padding:4px; border-radius:6px; display:inline-flex;
  }
  .del-btn:hover{opacity:1; background:var(--danger-soft);}

  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); padding:0 20px; background:var(--surface);}
  .tab-btn{
    padding:13px 6px; background:none; border:none; cursor:pointer; font-size:14px;
    font-weight:700; color:var(--ink-soft); border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .tab-btn.active{color:var(--forest); border-bottom-color:var(--gold);}

  .inventory-chip{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--cream); border:1px solid var(--line); border-radius:10px; margin-bottom:8px;
  }
  .inventory-chip .name{font-weight:700; font-size:13.5px; color:var(--forest);}
  .inventory-chip .qty{font-weight:800; font-size:15px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--forest); color:#fff; padding:12px 22px; border-radius:10px;
    font-size:13.5px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:.25s; z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .badge-count{
    background:var(--rust); color:#fff; font-size:10.5px; font-weight:800;
    border-radius:999px; padding:1px 7px; margin-right:auto;
  }

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty-state svg{opacity:.35; margin-bottom:10px;}
  .empty-state p{font-size:13.5px; margin:0;}

  .worker-net{font-weight:800;}
  .worker-net.neg{color:var(--danger);}

  select#printReportType, .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

  @media print{
    .sidebar, .topbar, .tabs, .panel-head button, form.inline-form, .del-btn, .toolbar, .lightbox, .toast, #printArea ~ *{display:none !important;}
    body{background:#fff;}
    .content{padding:0;}
    #printArea{display:block !important;}
  }
  #printArea{display:none;}
  #printArea .print-header{display:flex; align-items:center; gap:14px; border-bottom:3px solid var(--forest); padding-bottom:14px; margin-bottom:18px;}
  #printArea .print-header img{width:60px; height:60px; border-radius:50%; object-fit:cover;}
  #printArea h2{margin:0; color:var(--forest);}
  #printArea table{margin-bottom:22px;}
  #printArea .print-meta{font-size:12px; color:#666; margin-top:20px;}

  .lightbox{
    display:none; position:fixed; inset:0; background:rgba(15,18,12,.88); z-index:300;
    align-items:center; justify-content:center; padding:30px; cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:90vw; max-height:85vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5); cursor:default;}
  .lightbox-close{
    position:absolute; top:18px; left:22px; color:#fff; font-size:32px; font-weight:300;
    cursor:pointer; line-height:1;
  }
</style>
</head>
<body>

<script>

const AUTH = { user: "admin", pass: "2003" };
const LOW_FEED_THRESHOLD = 500;   // kg
const LOW_MED_THRESHOLD = 10;     // units
const HR_WORK_DAYS_PER_MONTH = 26;   // عدد أيام العمل الرسمية في الشهر
const HR_REST_DAYS_PER_MONTH = 4;    // عدد أيام الإجازة الأسبوعية في الشهر

const DEFAULT_STATE_SHAPE = {
  feed: {receipts:[], consumption:[]},
  med: {receipts:[], usage:[]},
  egg: {daily:[], shipments:[]},
  custody: {custodyEntries:[], expenses:[]},

// يتأكد أن كل موديول فيه المصفوفات المتوقعة (وليست undefined/كائن مشوّه)، ويحوّل أي كائن قادم من Firebase (بدل مصفوفة) لمصفوفة آمنة
function normalizeModule(key, val){
  const shape = DEFAULT_STATE_SHAPE[key];
  const out = {};
  Object.keys(shape).forEach(field=>{
    const incoming = val && val[field];
    if(Array.isArray(incoming)){
      out[field] = incoming.filter(Boolean); // يشيل أي فراغات ناتجة عن تخزين Firebase للمصفوفات كـ object متقطّع
    }else if(incoming && typeof incoming === 'object'){
      // Firebase أحيانًا يخزّن المصفوفة كـ object بمفاتيح رقمية — نحوّلها هنا لمصفوفة عادية
      out[field] = Object.values(incoming).filter(Boolean);
    }else{
      out[field] = [];
    }
  });
  return out;
}

/* ---------------- storage helpers (Firebase Realtime Database) ---------------- */
async function loadAll(){
  if(!firebaseReady){
    showToast('⚠️ تعذر الاتصال بقاعدة البيانات السحابية — يعمل النظام محليًا فقط الآن');
    return;
  }
  const keys = ['feed','med','egg','custody','hr'];
  for(const k of keys){
    try{
      const snap = await db.ref('farmData/' + k).once('value');
      const val = snap.val();
      state[k] = normalizeModule(k, val);
    }catch(e){
      console.error('load failed for', k, e);
      state[k] = normalizeModule(k, null);
      showToast('تعذر تحميل البيانات من السحابة، تحقق من الاتصال');
    }
  }
}
async function saveModule(key){
  if(!firebaseReady){
    showToast('⚠️ لم يتم الحفظ سحابيًا — تعذر الاتصال بـ Firebase');
    return;
  }
  try{
    await db.ref('farmData/' + key).set(state[key]);
  }catch(e){ console.error('storage save failed', e); showToast('تعذر حفظ البيانات، حاول مرة أخرى'); }
}

function fmtDate(d){
  try{
    return new Date(d).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});
  }catch(e){ return d; }
}
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmtNum(n){ return (Math.round(n*100)/100).toLocaleString('ar-EG'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ============================================================
   COMPUTED HELPERS
   ============================================================ */
function feedBalances(){
  const bal = {};
  state.feed.receipts.forEach(r=>{ bal[r.type] = (bal[r.type]||0) + num(r.qty); });
  state.feed.consumption.forEach(c=>{ bal[c.type] = (bal[c.type]||0) - num(c.qty); });
  return bal;
}
function medBalances(){
  const bal = {};
  state.med.receipts.forEach(r=>{ bal[r.name] = (bal[r.name]||0) + num(r.qty); });
  state.med.usage.forEach(u=>{ bal[u.name] = (bal[u.name]||0) - num(u.qty); });
  return bal;
}
function medExpiry(){
  const exp = {};
  state.med.receipts.forEach(r=>{
    if(!exp[r.name] || new Date(r.expiry) < new Date(exp[r.name])) exp[r.name] = r.expiry;
  });
  return exp;
}
function custodyTotals(){
  const totalCustody = state.custody.custodyEntries.reduce((s,c)=>s+num(c.amount),0);
  const totalExpenses = state.custody.expenses.reduce((s,e)=>s+num(e.amount),0);
  return { totalCustody, totalExpenses, remaining: totalCustody - totalExpenses };
}
function todayFeedConsumption(){
  return state.feed.consumption.filter(c=>c.date===todayISO()).reduce((s,c)=>s+num(c.qty),0);
}
function eggDayTotal(d){
  return num(d.valid) + num(d.double) + num(d.broken) + num(d.deformed) + num(d.floor);
}
function todayEgg(){
  return state.egg.daily.find(d=>d.date===todayISO());
}
function last7DaysEggAvg(){
  const since = new Date(); since.setDate(since.getDate()-6);
  const recs = state.egg.daily.filter(d=> new Date(d.date) >= since);
  if(!recs.length) return 0;
  return recs.reduce((s,d)=>s+eggDayTotal(d),0) / recs.length;
}
// رصيد البيض الصالح اللي لسه في المزرعة ولم يُشحن للمعمل بعد (البيض الصالح فقط — الدبل مش بيتوجه للمعمل)
function eggPendingStock(){
  const totalValid = state.egg.daily.reduce((s,d)=>s+num(d.valid),0);
  const totalShipped = state.egg.shipments.reduce((s,sh)=>s+num(sh.qty),0);
  return totalValid - totalShipped;
}
function workerNet(worker, monthKey){
  const advTotal = state.hr.advances
    .filter(a=>a.worker===worker.id && (a.date||'').slice(0,7)===monthKey)
    .reduce((s,a)=>s+num(a.amount),0);
  const att = attendanceSummary(worker, monthKey);
  const net = num(worker.salary) - advTotal - att.absenceDeduction + att.bonusAmount;
  return { advTotal, net, ...att };
}
// ملخص الحضور والغياب لعامل معيّن خلال شهر معيّن
// الشهر فيه 26 يوم عمل رسمي + 4 أيام إجازة أسبوعية.
// لو العامل حضر الـ26 يوم بالكامل بدون أي غياب، يُضاف له 4 أيام إضافية (مكافأة الحضور الكامل).
// أي يوم غياب يُخصم من الراتب بقيمة يوم العمل (الراتب ÷ 26).
function attendanceSummary(worker, monthKey){
  const records = state.hr.attendance.filter(a=>a.worker===worker.id && (a.date||'').slice(0,7)===monthKey);
  const absentDays = records.filter(a=>a.status==='absent').length;
  const presentDays = records.filter(a=>a.status==='present').length;
  const dailyWage = num(worker.salary) / HR_WORK_DAYS_PER_MONTH;
  const absenceDeduction = absentDays * dailyWage;
  const fullAttendance = absentDays===0 && presentDays >= HR_WORK_DAYS_PER_MONTH;
  const bonusDays = fullAttendance ? HR_FULL_ATTENDANCE_BONUS_DAYS : 0;
  const bonusAmount = bonusDays * dailyWage;
  return { absentDays, presentDays, dailyWage, absenceDeduction, fullAttendance, bonusDays, bonusAmount };
}

function statCard(kind, label, value, cls, icon, delta){

  return `
  <div class="stat-card">
    <div class="icon-wrap" style="background:${colorMap[icon]||'var(--gold)'}22; color:${colorMap[icon]||'var(--gold)'};">${ICONS[icon]||ICONS.feather}</div>
    <div class="label">${label}</div>
    <div class="value ${cls}">${value}</div>
    <div class="delta">${delta}</div>
  </div>`;
}
function emptyState(msg){
  return `<div class="empty-state">${ICONS.feather}<p>${msg}</p></div>`;
}
function escapeHtml(s){
  return (s??'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function listRows(arr, tpl, colspan){
  if(!arr.length) return `<tr class="empty-row"><td colspan="${colspan}">لا توجد بيانات مسجّلة بعد</td></tr>`;
  return [...arr].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b._created||0)-(a._created||0)).map(tpl).join('');
}

/* ---------------- image helpers ---------------- */
function resizeImageFile(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function saveAttendance(e){
  e.preventDefault();
  const date = val('att_date');
  if(!date){ showToast('اختر التاريخ أولاً'); return false; }
  let savedCount = 0;
  state.hr.workers.forEach(w=>{
    const sel = document.getElementById('att_status_'+w.id);
    const status = sel ? sel.value : '';
    // نشيل أي سجل حضور/غياب سابق لنفس العامل ونفس اليوم قبل إضافة الجديد (تحديث بدل تكرار)
    state.hr.attendance = state.hr.attendance.filter(a=>!(a.worker===w.id && a.date===date));
    if(status==='present' || status==='absent'){
      state.hr.attendance.push({id:uid(), _created:Date.now(), worker:w.id, date, status});
      savedCount++;
    }
  });
  await saveModule('hr'); renderPage('hr');
  showToast(savedCount ? 'تم حفظ الحضور والغياب' : 'لم يتم تحديد حالة لأي عامل');
  return false;
}
async function deleteWorker(id){
  if(!confirm('سيتم حذف العامل وكل سُلفه المسجّلة. متابعة؟')) return;
  state.hr.workers = state.hr.workers.filter(w=>w.id!==id);
  state.hr.advances = state.hr.advances.filter(a=>a.worker!==id);
  await saveModule('hr'); renderPage('hr'); showToast('تم حذف العامل');
}

function printReport(){
  const type = document.getElementById('printReportType').value;
  const def = REPORT_DEFS[type];
  const area = document.getElementById('printArea');
  let html = `
    <div class="print-header">
      <img src="${LOGO_URL}" onerror="this.style.display='none'">
      <div><h2>${def.title}</h2><div style="font-size:12.5px;color:#555;">مزرعة الرومي — نظام الإدارة المتكامل</div></div>
    </div>`;
  def.sections.forEach(sec=>{
    const rows = sec.rows();
    html += `<h3 style="color:#223420;">${sec.name}</h3>
      <table border="1" cellspacing="0" cellpadding="6" style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr>${sec.cols.map(c=>`<th style="background:#f2ede0; text-align:right;">${c}</th>`).join('')}</tr></thead>
        <tbody>${rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${sec.cols.length}" style="text-align:center;color:#999;">لا توجد بيانات</td></tr>`}</tbody>
      </table>`;
  });
  html += `<div class="print-meta">تاريخ الطباعة: ${fmtDate(todayISO())}</div>`;
  area.innerHTML = html;
  window.print();
}

function exportCSV(){
  const type = document.getElementById('printReportType').value;
  const def = REPORT_DEFS[type];
  let csv = '\uFEFF';
  def.sections.forEach(sec=>{
    csv += sec.name + '\r\n';
    csv += sec.cols.join(',') + '\r\n';
    sec.rows().forEach(r=>{ csv += r.map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(',') + '\r\n'; });
    csv += '\r\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${def.title}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('تم تصدير الملف بصيغة CSV');
}
